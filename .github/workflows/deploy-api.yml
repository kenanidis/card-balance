name: Deploy Card Balance API

on:
  # The public balance API deployment is retired. Keep the workflow available
  # only for an explicit manual run if the project is resumed in the future.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-balance-api-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Deploy Cloudflare Pages Functions
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-public --project-name=card-balance-api --branch=main
